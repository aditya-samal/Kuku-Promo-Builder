services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - project_data:/data
    restart: unless-stopped
  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - project_data:/data
    restart: unless-stopped
volumes:
  project_data:
